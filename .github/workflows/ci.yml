name: check and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package:check

  integration:
    name: vs code ${{ matrix.vscode }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode: [stable]
        include:
          - os: ubuntu-latest
            vscode: '1.96.0'
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:integration
        if: runner.os == 'Linux'
      - run: npm run test:integration
        if: runner.os != 'Linux'

  package:
    name: installable vsix
    needs: [test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: install and exercise the exact vsix in a fresh profile
        run: xvfb-run -a npm run test:packaged
        env:
          SPECTER_PROFILE_DIR: ${{ runner.temp }}/specter-profile
      - name: keep packaged-extension cpu profiles and memory measurements
        uses: actions/upload-artifact@v7
        with:
          name: specter-performance
          path: ${{ runner.temp }}/specter-profile
          if-no-files-found: error
          retention-days: 14
      - name: verify installable archive and checksum
        working-directory: dist
        run: |
          unzip -t ./*.vsix
          sha256sum --check ./*.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: specter-vsix
          path: |
            dist/*.vsix
            dist/*.vsix.sha256
            dist/inspect-line.js
            dist/inspect-line.js.sha256
            dist/inspection-setup.md
          if-no-files-found: error
          retention-days: 14

  release:
    name: github beta release
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'mot1us/specter'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: specter-vsix
          path: dist
      - name: verify artifacts
        working-directory: dist
        run: |
          unzip -t ./*.vsix
          sha256sum --check ./*.sha256
      - name: lowercase release titles and prose
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lowercase-releases.js
      - name: publish the tested github beta for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-beta.js
