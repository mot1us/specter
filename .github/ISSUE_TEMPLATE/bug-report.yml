name: bug report
description: report an installation or live follow behavior problem
body:
  - type: input
    id: versions
    attributes:
      label: extension version and vs code version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: operating system
      options:
        - macos
        - windows
        - linux
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: what happened and how to reproduce it
      description: include your replay mode and whether the folder is local. use disposable code and avoid private source or paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: what did you expect?
    validations:
      required: true
